name: Windows build and transfer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, test, package
        shell: pwsh
        run: ./scripts/Build.ps1 -Publish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Published native host integration
        shell: pwsh
        run: python tests/native-smoke.py --app artifacts/OpenDownload --data test-results/native-ci --root .
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDownload-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenDownload-win-x64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --title "OpenDownload $RELEASE_TAG" --generate-notes --prerelease
